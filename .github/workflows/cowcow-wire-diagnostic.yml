name: CowCow public wire-schema diagnostic
on:
  push:
    branches: [diagnostic/cowcow-wire-schema]
permissions: {}
jobs:
  inspect-public-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect public frontend links and contract metadata only
        shell: bash
        run: |
          python3 - <<'PY'
          import ast, base64, json, re, urllib.parse, urllib.request
          from datetime import datetime, timezone
          CONTRACT = 'erd1qqqqqqqqqqqqqpgqqgzzsl0re9e3u0t3mhv3jwg6zu63zssd7yqs3uu9jk'
          def read(url):
              host = urllib.parse.urlparse(url).hostname or ''
              assert host in {'api.multiversx.com','gateway.multiversx.com'} or host == 'cowcow.io' or host.endswith('.cowcow.io'), host
              with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':'Hello-Cowcow-wire-diagnostic'}), timeout=15) as response:
                  return response.read(18000000).decode('utf-8')
          homes = ['https://www.cowcow.io/']
          seen_scripts = set()
          for home in homes:
              if len(seen_scripts)>20: break
              print('HOME', home)
              try:
                  html = read(home)
                  scripts = [urllib.parse.urljoin(home,s) for s in re.findall(r'<script[^>]*src=[\"\']([^\"\']+)',html)]
                  try:
                      manifest = json.loads(read(urllib.parse.urljoin(home,'asset-manifest.json')))
                      scripts += [urllib.parse.urljoin(home,s) for s in manifest.get('files',{}).values() if isinstance(s,str) and s.endswith('.js')]
                  except Exception: pass
                  for url in dict.fromkeys(scripts):
                      if url in seen_scripts: continue
                      seen_scripts.add(url)
                      try:
                          source = read(url)
                          print('SCRIPT',url,len(source))
                          urls = sorted(set(re.findall(r'https?://[^\s\"\'<>`\\)]+',source)))
                          print('PUBLIC_LINKS',json.dumps([u[:300] for u in urls if any(x in u.lower() for x in ['cowcow','stake','moove'])]))
                          for link in urls:
                              parts = urllib.parse.urlparse(link)
                              if parts.hostname and parts.hostname.endswith('.cowcow.io') and any(x in parts.hostname for x in ['app.','stake.','staking.','dapp.']):
                                  candidate='https://'+parts.hostname+'/'
                                  if candidate not in homes and len(homes)<6: homes.append(candidate)
                          if 'getAllDataForUser' in source:
                              for match in re.finditer(r'JSON\.parse\((\'(?:[^\'\\]|\\.)*\')\)',source):
                                  if 'getAllDataForUser' not in match.group(1): continue
                                  try:
                                      data=json.loads(ast.literal_eval(match.group(1)))
                                      print('EMBEDDED_ABI_JSON',json.dumps(data))
                                  except Exception as error: print('ABI_PARSE_ERROR',str(error))
                              windows=[]
                              for term in ['getAllDataForUser','getTotalRewardsToCollect','UserData','FetchData','staked_tokens','rewardsToCollect']:
                                  for m in list(re.finditer(re.escape(term),source))[:4]:
                                      if any(a<=m.start()<=b for a,b in windows): continue
                                      a,b=max(0,m.start()-1800),min(len(source),m.end()+12000)
                                      windows.append((a,b))
                                      print('SCHEMA_CONTEXT',term,source[a:b])
                          elif home=='https://www.cowcow.io/':
                              for m in list(re.finditer(r'(?i)staking|stake',source))[:8]:
                                  print('STAKING_LINK_CONTEXT',source[max(0,m.start()-150):m.end()+350])
                      except Exception as error: print('SCRIPT_ERROR',url,str(error))
              except Exception as error: print('HOME_ERROR',home,str(error))
          def leb(data,p):
              value,shift=0,0
              while True:
                  b=data[p]; p+=1; value|=(b&127)<<shift
                  if b<128: return value,p
                  shift+=7
          try:
              info=json.loads(read('https://gateway.multiversx.com/address/'+CONTRACT))
              account=info.get('data',{}).get('account',{})
              print('ACCOUNT_KEYS',list(account))
              code=account.get('code','')
              raw=bytes.fromhex(code) if code.startswith('0061736d') else base64.b64decode(code)
              print('WASM_SIZE',len(raw))
              p=8
              while p<len(raw):
                  section=raw[p]; p+=1
                  size,p=leb(raw,p); end=p+size
                  if section==7:
                      count,p=leb(raw,p); names=[]
                      for _ in range(count):
                          n,p=leb(raw,p); name=raw[p:p+n].decode(); p+=n
                          kind=raw[p]; p+=1; idx,p=leb(raw,p); names.append(name)
                      print('WASM_EXPORTS',json.dumps(names))
                  p=end
          except Exception as error: print('CODE_ERROR',type(error).__name__,str(error))
          PY
