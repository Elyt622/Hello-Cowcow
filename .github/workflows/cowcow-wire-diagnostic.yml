name: CowCow public wire-schema diagnostic
on:
  push:
    branches: [diagnostic/cowcow-wire-schema]
permissions: {}
jobs:
  inspect-public-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Decode public read-only query using original staking ABI
        shell: bash
        run: |
          python3 - <<'PY'
          import ast, base64, json, re, urllib.request
          from datetime import datetime, timezone
          from decimal import Decimal
          CONTRACT='erd1qqqqqqqqqqqqqpgqqgzzsl0re9e3u0t3mhv3jwg6zu63zssd7yqs3uu9jk'
          CALLER='erd1fdq6nmaa62c0cz8f299ycsz0q8lyfr7q87gqpjwnweux5uu9pqcq68ejhz'
          BUNDLE='https://staking.cowcow.io/static/js/main.19e7a970.js'
          def request(url, body=None):
              assert url in {BUNDLE, 'https://api.multiversx.com/query'}
              if body is not None:
                  assert url.endswith('/query') and body['funcName'] == 'getAllDataForUser'
              req=urllib.request.Request(url,data=None if body is None else json.dumps(body).encode(),headers={'Content-Type':'application/json','User-Agent':'Hello-Cowcow-read-only-diagnostic'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  return r.read(5000000).decode()
          source=request(BUNDLE)
          position=source.index(CONTRACT)
          print('CONTRACT_REFERENCE',source[max(0,position-80):position+len(CONTRACT)+80])
          abis=[]
          for m in re.finditer(r'JSON\.parse\((\'(?:[^\'\\]|\\.)*\')\)',source):
              if 'getAllDataForUser' in m.group(1):
                  abis.append(json.loads(ast.literal_eval(m.group(1))))
          assert len(abis)==1
          abi=abis[0]
          print('DATAOUT_ABI',json.dumps(abi['types']))
          class Decoder:
              def __init__(self, data): self.data=data; self.pos=0
              def take(self,n):
                  assert 0<=n<=len(self.data)-self.pos,'Truncated payload'
                  result=self.data[self.pos:self.pos+n]; self.pos+=n; return result
              def number(self,n): return int.from_bytes(self.take(n),'big')
              def decode(self,t):
                  if t=='u64': return self.number(8)
                  if t=='BigUint': return self.number(self.number(4))
                  if t=='TokenIdentifier': return self.take(self.number(4)).decode('ascii')
                  if t.startswith('List<'):
                      count=self.number(4); assert count<=len(self.data)
                      return [self.decode(t[5:-1]) for _ in range(count)]
                  fields=abi['types'][t]['fields']
                  return {f['name']:self.decode(f['type']) for f in fields}
          for label,address in [('empty',CONTRACT),('staking-position',CALLER)]:
              response=json.loads(request('https://api.multiversx.com/query',{'scAddress':CONTRACT,'funcName':'getAllDataForUser','caller':address,'args':[],'value':'0'}))
              assert response.get('returnCode')=='ok',response
              assert len(response['returnData'])==1
              encoded=response['returnData'][0]
              raw=base64.b64decode(encoded,validate=True)
              decoder=Decoder(raw)
              result=decoder.decode('DataOut')
              assert decoder.pos==len(raw),(decoder.pos,len(raw))
              moove=sum(p['amount'] for p in result['rewards_accumulated_for_user'] if p['token_identifier']=='MOOVE-875539' and p['token_nonce']==0)
              print('OBSERVED_UTC',datetime.now(timezone.utc).isoformat())
              print('POSITION',label,'BYTES',len(raw),'STAKED',len(result['staked_nfts']),'MOOVE',Decimal(moove)/Decimal(10**18))
              print('REAL_RETURN_DATA',label,encoded)
              print('DECODED_DATAOUT',label,json.dumps(result))
          PY
