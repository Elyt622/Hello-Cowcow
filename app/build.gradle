plugins {
  id 'com.android.application'
  id 'com.google.devtools.ksp'
  id 'com.google.dagger.hilt.android'
  id 'org.jetbrains.kotlin.plugin.compose'
}

android {
  namespace 'com.example.hellocowcow'
  compileSdk 37

  defaultConfig {
    applicationId "com.example.hellocowcow"
    minSdk 24
    targetSdk 36
    versionCode 1
    versionName "1.0"
    multiDexEnabled true

    Properties properties = new Properties()
    def localPropertiesFile = project.rootProject.file('local.properties')
    if (localPropertiesFile.exists()) {
      localPropertiesFile.withInputStream { properties.load(it) }
    }
    resValue "string", "wallet_connect_id", properties.getProperty("wallet.connect.id", "")

    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    vectorDrawables {
      useSupportLibrary true
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile(
          'proguard-android-optimize.txt'
      ), 'proguard-rules.pro'
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  buildFeatures {
    compose true
  }
}

def retrofit_version = "2.9.0"
def hilt_version = "2.60.1"
def lifecycle_version = "2.11.0"

dependencies {

  implementation "androidx.core:core-ktx:1.15.0"
  implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"
  implementation "androidx.appcompat:appcompat:1.7.0"
  implementation "com.google.android.material:material:1.12.0"
  implementation "androidx.annotation:annotation:1.9.1"
  implementation "androidx.constraintlayout:constraintlayout:2.2.0"
  implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
  implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
  implementation "androidx.lifecycle:lifecycle-runtime-compose:$lifecycle_version"

  implementation 'com.github.GrenderG:Toasty:1.5.2'

  implementation 'com.google.guava:guava:32.1.2-jre'

  // Glide
  implementation 'com.github.bumptech.glide:compose:4.14.0'
  implementation 'com.github.bumptech.glide:annotations:4.16.0'
  implementation 'com.google.accompanist:accompanist-drawablepainter:0.30.1'

  implementation 'androidx.multidex:multidex:2.0.1'

  // Compose
  def composeBom = platform('androidx.compose:compose-bom:2026.08.00')
  implementation composeBom
  testImplementation composeBom
  androidTestImplementation composeBom

  implementation 'androidx.activity:activity-compose:1.13.0'
  implementation 'androidx.compose.ui:ui'
  implementation 'androidx.compose.ui:ui-graphics'
  implementation 'androidx.compose.ui:ui-tooling-preview'
  implementation 'androidx.compose.material3:material3'
  implementation 'androidx.navigation:navigation-compose:2.8.4'
  implementation 'androidx.compose.material:material-icons-extended'
  implementation 'androidx.compose.runtime:runtime-rxjava3'

  // WalletConnect
  implementation 'com.reown:sign:1.0.0'
  implementation 'com.reown:android-core:1.0.0'

  // SplashScreen
  implementation "androidx.core:core-splashscreen:1.0.1"

  // RxJava - kept temporarily while features are migrated incrementally.
  implementation 'io.reactivex.rxjava3:rxjava:3.1.7'
  implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'
  implementation 'io.reactivex.rxjava3:rxkotlin:3.0.1'

  // Retrofit - kept on 2.x for the foundation build; network migration is a separate step.
  implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
  implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"
  implementation "com.squareup.retrofit2:adapter-rxjava3:$retrofit_version"
  implementation "com.squareup.okhttp3:okhttp:4.12.0"

  implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'

  // Hilt
  implementation "com.google.dagger:hilt-android:$hilt_version"
  ksp "com.google.dagger:hilt-compiler:$hilt_version"
  androidTestImplementation "com.google.dagger:hilt-android-testing:$hilt_version"
  kspAndroidTest "com.google.dagger:hilt-compiler:$hilt_version"
  testImplementation "com.google.dagger:hilt-android-testing:$hilt_version"
  kspTest "com.google.dagger:hilt-compiler:$hilt_version"

  // Test
  testImplementation 'junit:junit:4.13.2'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
  androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
  androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
  debugImplementation 'androidx.compose.ui:ui-tooling'
  debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
